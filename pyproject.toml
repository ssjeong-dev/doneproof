[project]
name = "doneproof"
version = "0.1.0"
description = "Evidence-backed task auditing with configurable enforcement"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2"]
[project.scripts]
doneproof = "execution_audit.cli:main"
execution-audit = "execution_audit.cli:main"
execution-audit-server = "execution_audit.server:main"
execution-audit-admin = "execution_audit.admin:main"
execution-audit-worker = "execution_audit.worker:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/execution_audit"]
